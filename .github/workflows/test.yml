name: Test

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . coverage black flake8
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report
      - run: black --check src/studytool/*.py tests/*.py
      - run: flake8 src tests
